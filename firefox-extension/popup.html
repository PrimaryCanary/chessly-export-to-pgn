<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chessly PGN Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Chessly PGN Exporter</h1>
      <p>Open a Chessly study’s Lines page, then export its moves and comments.</p>
      <button id="export" type="button">Download PGN</button>
      <hr>
      <h2>Upload to Lichess</h2>
      <p id="lichess-status">Not connected to Lichess.</p>
      <button id="connect" type="button">Connect Lichess</button>
      <button id="disconnect" type="button" hidden>Disconnect Lichess</button>
      <label for="study">Lichess study URL or ID</label>
      <input id="study" type="text" placeholder="https://lichess.org/study/abcdefgh" autocomplete="off">
      <label for="chapter">New chapter name</label>
      <input id="chapter" type="text" maxlength="100" placeholder="Chessly lesson" autocomplete="off">
      <label for="orientation">Board orientation</label>
      <select id="orientation">
        <option value="">Automatic</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
      <button id="upload" type="button">Upload as new chapter</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
